name: Image

# Builds the container the dashboard deploys.
#
# Runs here rather than on the host on purpose: the host is a home machine, and
# "docker build" there competes with the bot it is rebuilding. The dashboard's
# "update image" button pulls the tag this produces.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A second push while the first is still building only ever wanted the newer image.
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Lowercase because a registry reference has to be, and the owner is not.
          tags: |
            ghcr.io/polarbaejr/taq-event-bot:latest
            ghcr.io/polarbaejr/taq-event-bot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
